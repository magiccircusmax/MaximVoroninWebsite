<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Import both Impact and Oswald fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modeling - Maxim Voronin</title>
  <style>
    /* General Styles */
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      position: relative;
      color: black;
      padding: 20px;
      background-color: white;
      height: 140px;
      z-index: 10;
      border-bottom: 4px solid #000;
    }
    /* Header elements (same as homepage) */
    .logo {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .logo img {
      height: 100px;
    }
    .title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-family: Impact, sans-serif;
      margin: 0;
    }
    .header-right {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .social-links a {
      text-decoration: none;
      display: inline-block;
    }
    .social-links a img {
      height: 40px;
      transform: rotate(0deg) !important;
    }
    .hamburger {
      cursor: pointer;
      position: relative;
    }
    .hamburger img {
      height: 40px;
    }
    .menu-list {
      font-family: "Oswald", sans-serif;
      font-size: 35px;
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      padding: 10px;
      z-index: 9999;
    }
    .menu-list a {
      display: block;
      text-decoration: none;
      color: black;
      margin: 5px 0;
      white-space: nowrap;
    }
    /* Main Content */
    main {
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 20px;
      text-align: left;
      font-family: "Oswald", sans-serif;
    }
    main h1 {
      font-family: Impact, sans-serif;
      font-size: 48px;
      text-align: center;
      margin-top: 20px;
      margin-bottom: 20px;
    }
    /* Section Headings */
    .section-heading {
      font-weight: bold;
      font-size: 32px;
      margin: 20px 0 10px;
      text-align: left;
    }
    /* Section Container */
    .section {
      margin-bottom: 40px;
    }
    /* Gallery grid for each modeling section */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .gallery-grid img {
      width: 100%;
      height: auto;
      border-radius: 5px;
    }
    .gallery-grid img.equal-dimensions {
      height: 300px; /* Adjust as needed */
      object-fit: cover;
    }
    footer {
      background-color: black;
      color: white;
      padding: 10px;
      text-align: center;
      font-family: "Oswald", sans-serif;
      margin-top: 40px;
    }
    
    /* ---------------- Mobile Styles ---------------- */
    @media (max-width: 768px) {
      /* Mobile Header: two rows grid */
      header {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        align-items: center;
        padding: 10px;
        position: relative;
        height: auto;
      }
      /* Logo in first row, left column */
      .logo {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
        position: static;
        text-align: left;
      }
      .logo img {
        height: 60px;
        margin-top: 50px;
      }
      /* Social icons and hamburger in first row, right column */
      .header-right {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        position: static;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 20px;
      }
      .social-links a img, .hamburger img {
        height: 30px;
      }
      /* Title spans both columns in the second row, centered */
      .title {
        grid-column: 1 / 3;
        grid-row: 2 / 3;
        text-align: center;
        margin-top: -10px;
        font-size: 40px;
        position: static;
        transform: none;
      }
      /* Add horizontal padding ("cushions") for main content */
      main {
        padding: 0 20px;
      }
      /* Stack the videos grid vertically if needed */
      .videos-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      main h1 {
        font-size: 36px;
      }
      .sub-heading {
        font-size: 24px;
      }
      .video-card p {
        font-size: 20px;
      }
    }
  </style>
</head>

  <!-- JavaScript for Hamburger Menu -->
  <script>
    document.getElementById('hamburger').addEventListener('click', function(event) {
      event.stopPropagation();
      var menuList = document.getElementById('menu-list');
      menuList.style.display = (menuList.style.display === 'block') ? 'none' : 'block';
    });
    document.addEventListener('click', function() {
      var menuList = document.getElementById('menu-list');
      if (menuList.style.display === 'block') {
        menuList.style.display = 'none';
      }
    });
